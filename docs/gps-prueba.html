<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Copiloter · Prueba de ubicación</title><style>body{margin:0;padding:24px;background:#cbd9d0;color:#20382f;font:17px/1.5 system-ui}main{max-width:600px;margin:auto}button{font:inherit;padding:16px;border:0;border-radius:10px;background:#244b3b;color:white;width:100%;margin:6px 0}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:18px;background:white;border-radius:10px;font:15px/1.6 system-ui}a{color:#244b3b}</style></head><body><main><h1>Prueba de ubicación</h1><p>Pulsa el botón y mantén esta página abierta hasta un minuto.</p><button id="precise">Probar ubicación precisa</button><button id="approximate">Probar ubicación aproximada</button><pre id="result" role="status" aria-live="polite">Todavía no se ha solicitado ubicación.</pre><p>Esta prueba no carga mapas ni descarga líneas. No muestra, guarda ni envía tus coordenadas.</p><a href="./">Volver a Copiloter</a></main><script>
const output=document.getElementById('result'),precise=document.getElementById('precise'),approximate=document.getElementById('approximate');let generation=0,timer=null;
function test(high){const token=++generation;clearTimeout(timer);precise.disabled=approximate.disabled=true;const started=Date.now();let done=false;function finish(text){if(done||token!==generation)return;done=true;clearTimeout(timer);precise.disabled=approximate.disabled=false;output.textContent='Prueba aislada · 2026-11-04.1\nModo: '+(high?'preciso':'aproximado')+'\nTiempo: '+Math.round((Date.now()-started)/1000)+' s\n'+text+'\nNavegador: '+navigator.userAgent;}output.textContent='Solicitando ubicación '+(high?'precisa':'aproximada')+'… Espera hasta 70 segundos.';if(!window.isSecureContext||!navigator.geolocation){finish('Ubicación no disponible en este contexto.');return;}timer=setTimeout(()=>finish('Sin respuesta del navegador después de 70 segundos.'),70000);try{navigator.geolocation.getCurrentPosition(position=>{const c=position?.coords;if(!c||!Number.isFinite(c.latitude)||!Number.isFinite(c.longitude)||!Number.isFinite(c.accuracy)){finish('El navegador ha devuelto datos no válidos.');return;}finish('POSICIÓN RECIBIDA\nPrecisión: '+Math.round(c.accuracy)+' m\nAntigüedad: '+(Number.isFinite(position.timestamp)?Math.round((Date.now()-position.timestamp)/1000)+' s':'desconocida'));},error=>finish('ERROR '+error.code+': '+String(error.message||'Sin mensaje')),{enableHighAccuracy:high,maximumAge:60000,timeout:60000});}catch(error){finish('Excepción: '+String(error.message||error));}}
precise.onclick=()=>test(true);approximate.onclick=()=>test(false);window.addEventListener('pagehide',()=>{generation++;clearTimeout(timer);});
</script></body></html>
